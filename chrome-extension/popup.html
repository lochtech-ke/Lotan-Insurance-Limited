<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotan Risk Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="extension-container">
    <!-- Header -->
    <header class="header">
      <div class="header-logo-container">
        <svg class="header-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" rx="28" fill="#10B981" fill-opacity="0.15"/>
          <path d="M35 25V75H65" stroke="#10B981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M48 35V62H65" stroke="#F5F5F7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>LOTAN RISK ADVISOR</h1>
        <p>Institutional Credit & Guarantees</p>
      </div>
      <div class="status-indicator" title="Ready to assist">
        <div class="pulse-ring"></div>
        <div class="status-dot"></div>
      </div>
    </header>

    <!-- Chat Messages Feed -->
    <main class="chat-feed" id="chat-messages">
      <!-- Initial Bot Welcome Message -->
      <div class="message bot-message fade-in-up">
        <div class="message-content">
          Hello! I am your Lotan Risk Advisor. Ask me about our credit protection policies, performance security bonds, tender bid bonds, or refund terms.
        </div>
      </div>
    </main>

    <!-- Quick Prompts Chips -->
    <section class="chips-container" id="chips-container">
      <button class="chip" data-query="Who is Lotan Insurance?">Who is Lotan?</button>
      <button class="chip" data-query="What are your core products?">Core Products</button>
      <button class="chip" data-query="What is a Credit Protection Policy?">Credit Protection</button>
      <button class="chip" data-query="What are Performance Security Bonds?">Performance Bonds</button>
      <button class="chip" data-query="What are your refund terms?">Refund Policy</button>
      <button class="chip" data-query="How can I contact you?">Contact Info</button>
    </section>

    <!-- Input Bar -->
    <footer class="input-bar">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="chat-input" 
          placeholder="Ask a risk question..." 
          autocomplete="off"
          aria-label="Ask a question"
        />
        <button type="button" id="send-btn" class="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Include Scripts -->
  <script src="faq-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
